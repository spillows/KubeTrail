name: test

on:
  push:
    branches: [main]
  pull_request:

# The job reads the code only. It does not need write access.
permissions:
  contents: read

jobs:
  pytest:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: run.sh has valid syntax
        run: bash -n run.sh
