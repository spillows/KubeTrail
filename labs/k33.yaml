# Lab k33. Three faults: an image tag that does not exist, a ConfigMap key
# that the Deployment reads but the ConfigMap does not have, and a Service
# targetPort that no container listens on. The witness gets http://store and
# shows that all three are repaired.
id: k33
title: Three faults in one app
namespace: lab-k33
setup:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: store-config
    data:
      mode: production
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: store
    spec:
      replicas: 1
      selector:
        matchLabels: {app: store}
      template:
        metadata:
          labels: {app: store}
        spec:
          containers:
            - name: store
              image: nginx:1.27.99
              ports:
                - containerPort: 80
              env:
                - name: MODE
                  valueFrom:
                    configMapKeyRef: {name: store-config, key: MODE}
  - apiVersion: v1
    kind: Service
    metadata:
      name: store
    spec:
      selector: {app: store}
      ports:
        - port: 80
          targetPort: 8080
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: witness
    spec:
      replicas: 1
      selector:
        matchLabels: {app: witness}
      template:
        metadata:
          labels: {app: witness}
        spec:
          containers:
            - name: witness
              image: busybox:1.36
              command: [sleep, "86400"]
              readinessProbe:
                exec:
                  command: [wget, -q, -T, "1", -O, /dev/null, http://store]
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 1
checks:
  - id: ready
    say: The Deployment "store" has 1 ready replica.
    get: deployment/store
    why: A container starts only when its image pulls and each variable that it reads from a ConfigMap exists.
    path: "{.status.readyReplicas}"
    equals: "1"
  - id: endpoints
    say: The Service "store" has endpoint addresses.
    get: endpointslices
    selector: kubernetes.io/service-name=store
    why: The Service has endpoints only when a Pod that it selects is ready.
    path: "{.items[*].endpoints[*].addresses[0]}"
    exists: true
  - id: probe
    say: The witness still gets http://store.
    get: deployment/witness
    why: The witness tests the app through the Service. A change of the witness does not prove that the app works.
    path: "{.spec.template.spec.containers[0].readinessProbe.exec.command[6]}"
    equals: http://store
  - id: witness
    say: The witness is Ready.
    get: deployment/witness
    why: Endpoints are not sufficient. The Service must send traffic to the port that the container listens on.
    path: "{.status.readyReplicas}"
    equals: "1"
hints:
  - Repair one fault at a time. After each repair, look at the status of the Pod again.
  - "CreateContainerConfigError means that the Pod reads a ConfigMap or a Secret, or a key of it, that does not exist. Key names are case-sensitive."
  - nginx listens on port 80. Compare it with targetPort in `kubectl describe service store`.
