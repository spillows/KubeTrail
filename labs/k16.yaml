# Lab k16. Needs Calico: the default minikube network does not enforce
# NetworkPolicy. Two witnesses get http://web. The policy permits "allowed"
# (role=client) and blocks "blocked". The replicas check of "blocked" makes
# sure that the learner did not delete it.
id: k16
title: Deny all, then permit one client
namespace: lab-k16
needs: [cni:calico]
setup:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      replicas: 1
      selector:
        matchLabels: {app: web}
      template:
        metadata:
          labels: {app: web}
        spec:
          containers:
            - name: web
              image: nginx:1.27
              ports:
                - containerPort: 80
  - apiVersion: v1
    kind: Service
    metadata:
      name: web
    spec:
      selector: {app: web}
      ports:
        - port: 80
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: allowed
    spec:
      replicas: 1
      selector:
        matchLabels: {app: allowed}
      template:
        metadata:
          labels: {app: allowed, role: client}
        spec:
          containers:
            - name: witness
              image: busybox:1.36
              command: [sleep, "86400"]
              readinessProbe:
                exec:
                  command: [wget, -q, -T, "1", -O, /dev/null, http://web]
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 1
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: blocked
    spec:
      replicas: 1
      selector:
        matchLabels: {app: blocked}
      template:
        metadata:
          labels: {app: blocked}
        spec:
          containers:
            - name: witness
              image: busybox:1.36
              command: [sleep, "86400"]
              readinessProbe:
                exec:
                  command: [wget, -q, -T, "1", -O, /dev/null, http://web]
                periodSeconds: 2
                timeoutSeconds: 2
                failureThreshold: 1
checks:
  - id: policy
    say: A NetworkPolicy exists in the lab namespace.
    get: networkpolicies
    why: When no NetworkPolicy selects a Pod, the Pod accepts traffic from all Pods.
    path: "{.items[*].metadata.name}"
    exists: true
  - id: allowed
    say: The witness "allowed" is Ready.
    get: deployment/allowed
    why: The policy must permit Pods with role=client. A policy that refuses all traffic also stops this client.
    path: "{.status.readyReplicas}"
    equals: "1"
  - id: blocked-exists
    say: The witness "blocked" has 1 replica.
    get: deployment/blocked
    why: The lab tests the policy with this witness. Do not delete it or scale it to 0.
    path: "{.spec.replicas}"
    equals: "1"
  - id: blocked
    say: The witness "blocked" is not Ready.
    get: deployment/blocked
    why: A Pod without role=client must not reach "web". If "blocked" is Ready, the policy permits too much.
    path: "{.status.readyReplicas}"
    exists: false
hints:
  - A policy with an empty podSelector and policyTypes [Ingress] and no ingress rules refuses all incoming traffic to all Pods in the namespace.
  - A second policy selects the Pods with app=web, and permits ingress from a podSelector with role=client.
  - Policies add together. Traffic is permitted when one policy permits it.
  - Do not add Egress to policyTypes. Then the witnesses cannot reach the DNS server.
