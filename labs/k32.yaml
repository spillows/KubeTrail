# Lab k32. Setup makes a Service whose selector matches no Pod. The check
# reads the addresses in the EndpointSlices of the Service.
id: k32
title: A Service with no endpoints
namespace: lab-k32
setup:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: web
    spec:
      replicas: 2
      selector:
        matchLabels: {app: web}
      template:
        metadata:
          labels: {app: web}
        spec:
          containers:
            - name: web
              image: nginx:1.27
              ports:
                - containerPort: 80
  - apiVersion: v1
    kind: Service
    metadata:
      name: web
    spec:
      selector: {app: webapp}
      ports:
        - port: 80
checks:
  - id: endpoints
    say: The Service "web" has endpoint addresses.
    get: endpointslices
    selector: kubernetes.io/service-name=web
    why: A Service sends traffic only to the ready Pods that its selector matches. A wrong label gives no endpoints.
    path: "{.items[*].endpoints[*].addresses[0]}"
    exists: true
hints:
  - "`kubectl get endpointslices -l kubernetes.io/service-name=web` shows the endpoints of the Service."
  - Compare the selector in `kubectl describe service web` with the labels in `kubectl get pods --show-labels`.
  - "`kubectl edit service web` lets you change the selector."
