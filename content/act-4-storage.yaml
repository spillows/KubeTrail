id: IV
title: Storage
duration: about 2 hours
description: Keep data when a Pod stops. Ask for storage with a claim, and give each replica of a StatefulSet its own claim and a stable name.
quests:
- id: k17
  type: READ
  tags: [k8s]
  minutes: 40
  title: Read about volumes, claims, StorageClasses and StatefulSets
  task: Read the four concept pages. Write one sentence for each of these questions. What happens to the data of an emptyDir volume when its Pod stops? What does a PersistentVolumeClaim ask for, and what object gives it? What does a StorageClass do? What does a StatefulSet give each replica that a Deployment does not? Then click "Mark done".
  links:
  - title: Volumes
    url: https://kubernetes.io/docs/concepts/storage/volumes/
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
  - title: Storage Classes
    url: https://kubernetes.io/docs/concepts/storage/storage-classes/
  - title: StatefulSets
    url: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/
- id: k18
  type: LAB
  tags: [k8s]
  minutes: 30
  title: Data in a claim outlives the Pod that wrote it
  task: >-
    Click "Start lab". The lab namespace has the Deployment "witness". Its Pod
    mounts the claim "data" at /data, and it is Ready only when the file
    /data/marker exists. The claim does not exist, thus the witness is
    Pending. Make the claim "data" with 100Mi of storage. Make a Pod that
    mounts "data" and writes the file marker, then delete that Pod. The witness
    reads the file that the deleted Pod wrote. Then click "Check my work".
  links:
  - title: Configure a Pod to use a PersistentVolume for storage
    url: https://kubernetes.io/docs/tasks/configure-pod-container/configure-persistent-volume-storage/
  - title: Persistent Volumes
    url: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
- id: k19
  type: LAB
  tags: [k8s]
  minutes: 40
  title: A StatefulSet with a headless Service
  task: >-
    Click "Start lab". Make the headless Service "db", that is a Service with no
    cluster IP. Make the StatefulSet "db" with 3 replicas and the image
    nginx:1.27. It uses the Service "db", and it makes a claim with the name
    "data" for each replica. Find the stable DNS name of each Pod, and find
    the claim of each Pod. Then click "Check my work".
  links:
  - title: StatefulSet basics
    url: https://kubernetes.io/docs/tutorials/stateful-application/basic-stateful-set/
  - title: Headless Services
    url: https://kubernetes.io/docs/concepts/services-networking/service/#headless-services
