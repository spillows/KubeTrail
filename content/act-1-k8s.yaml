id: I
title: First objects
duration: about 4 hours
description: The objects that the rest of Kubernetes builds on. Run a Pod by hand, let a Deployment run your Pods, select Pods with a Service, run work to completion with Jobs, and share a volume between containers.
quests:
- id: k1
  type: READ
  tags: [k8s]
  minutes: 45
  title: Read about Pods, Deployments and Services
  task: Read the three concept pages. For each of Pod, Deployment, ReplicaSet and Service, write one sentence that says what it is responsible for. Then click "Mark done".
  links:
  - title: Pods
    url: https://kubernetes.io/docs/concepts/workloads/pods/
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  - title: Services
    url: https://kubernetes.io/docs/concepts/services-networking/service/
- id: k2
  type: LAB
  tags: [k8s]
  minutes: 20
  title: Run your first Pod
  task: >-
    Click "Start lab". Make a Pod with the name "hello", the image nginx:1.27
    and the label app=hello. A label is a key and a value. On the command line
    you write a label as key=value, thus app=hello is the key "app" with the
    value "hello". In YAML, the same label is under metadata.labels. Then
    examine the Pod. Find each step of the start in the Events. Find the start
    messages of nginx in the logs. Delete the Pod, and see that nothing makes it
    again. Then make the Pod again and click "Check my work". If you are stuck,
    show the hints.
  links:
  - title: Pods
    url: https://kubernetes.io/docs/concepts/workloads/pods/
  - title: Labels and selectors
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  - title: kubectl run
    url: https://kubernetes.io/docs/reference/kubectl/generated/kubectl_run/
  - title: Debug a Pod
    url: https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
- id: k3
  type: LAB
  tags: [k8s]
  minutes: 60
  title: Roll a Deployment and undo a bad rollout
  task: Click "Start lab". Make the Deployment "web" with 3 replicas of nginx:1.27. Expose it on port 80. Change the image to a tag that does not exist, and see the rollout stop. Then undo the rollout and click "Check my work".
  links:
  - title: Deployments
    url: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
  - title: kubectl cheat sheet
    url: https://kubernetes.io/docs/reference/kubectl/quick-reference/
- id: k4
  type: LAB
  tags: [k8s]
  minutes: 30
  title: A Service that selects the right Pods
  task: >-
    Click "Start lab". The lab namespace has two Deployments, "blue" and
    "green". The Pods of both have the label app=web. The Pods of "blue" also
    have track=blue, and the Pods of "green" have track=green. Make the Service
    "web" on port 80 that sends traffic only to the Pods of "green". Then find
    the EndpointSlice of the Service, and see which Pods it names. Click "Check
    my work".
  links:
  - title: Services
    url: https://kubernetes.io/docs/concepts/services-networking/service/
  - title: EndpointSlices
    url: https://kubernetes.io/docs/concepts/services-networking/endpoint-slices/
  - title: Labels and selectors
    url: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
- id: k5
  type: LAB
  tags: [k8s]
  minutes: 30
  title: Jobs and CronJobs
  task: >-
    Click "Start lab". Make the Job "pi" that calculates pi to 200 digits with
    the image perl:5.34 and runs to completion one time. Read the result in the
    logs of its Pod. Then make the CronJob "tick" that runs the image
    busybox:1.36 on the schedule "*/5 * * * *" (each 5 minutes). Click "Check
    my work".
  links:
  - title: Jobs
    url: https://kubernetes.io/docs/concepts/workloads/controllers/job/
  - title: CronJob
    url: https://kubernetes.io/docs/concepts/workloads/controllers/cron-jobs/
- id: k6
  type: LAB
  tags: [k8s]
  minutes: 40
  title: Init containers and a sidecar that share a volume
  task: >-
    Click "Start lab". Make the Pod "app". Its main container runs nginx:1.27.
    An init container writes an index.html file into an emptyDir volume before
    nginx starts, and nginx serves that file. A sidecar container reads the same
    volume while the Pod runs. Make the sidecar a native sidecar: an init
    container with restartPolicy Always. Examine the order in which the
    containers start. Then click "Check my work".
  links:
  - title: Init containers
    url: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
  - title: Sidecar containers
    url: https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
  - title: emptyDir volumes
    url: https://kubernetes.io/docs/concepts/storage/volumes/#emptydir
