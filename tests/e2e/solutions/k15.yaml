id: k15
steps:
  - apply:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata: {name: site}
        spec:
          gatewayClassName: quest
          listeners:
            - {name: http, protocol: HTTP, port: 80}
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata: {name: site}
        spec:
          parentRefs:
            - {name: site}
          rules:
            - matches:
                - path: {type: PathPrefix, value: /shop}
              backendRefs:
                - {name: shop, port: 80}
            - matches:
                - path: {type: PathPrefix, value: /blog}
              backendRefs:
                - {name: blog, port: 80}
  - run: [kubectl, wait, --for=condition=Programmed, gateway/site, -n, lab-k15, --timeout=180s]
  - run: [kubectl, wait, "--for=jsonpath={.status.readyReplicas}=1", deployment/witness, -n, lab-k15, --timeout=120s]
