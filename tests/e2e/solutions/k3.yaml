id: k3
steps:
  - run: [kubectl, create, deployment, web, --image=nginx:1.27, --replicas=3, -n, lab-k3]
  - run: [kubectl, rollout, status, deployment/web, -n, lab-k3, --timeout=180s]
  - run: [kubectl, set, image, deployment/web, nginx=nginx:0.0.0-no-such-tag, -n, lab-k3]
  - run: [kubectl, rollout, undo, deployment/web, -n, lab-k3]
  - run: [kubectl, rollout, status, deployment/web, -n, lab-k3, --timeout=180s]
  - run: [kubectl, expose, deployment, web, --port=80, -n, lab-k3]
