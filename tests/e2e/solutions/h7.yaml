id: h7
dir: charts/demo
steps:
- file:
    name: templates/migrate.yaml
    text: "apiVersion: batch/v1\nkind: Job\nmetadata:\n  name: migrate\n  annotations:\n    helm.sh/hook: pre-install\nspec:\n  template:\n    spec:\n      restartPolicy: Never\n      containers:\n    \
      \    - name: migrate\n          image: busybox:1.36\n          command: [echo, migrated]\n"
- run:
  - helm
  - install
  - demo
  - .
  - -n
  - lab-h7
  - --wait
  - --timeout
  - 180s
