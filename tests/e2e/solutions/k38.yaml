id: k38
steps:
  - apply:
      - apiVersion: apps/v1
        kind: DaemonSet
        metadata: {name: node-agent}
        spec:
          selector:
            matchLabels: {app: node-agent}
          template:
            metadata:
              labels: {app: node-agent}
            spec:
              tolerations:
                - {operator: Exists}
              containers:
                - name: agent
                  image: busybox:1.36
                  command: [sleep, "86400"]
  - run: [kubectl, rollout, status, daemonset/node-agent, -n, lab-k38, --timeout=180s]
