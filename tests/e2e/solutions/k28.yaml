id: k28
steps:
  - run: [kubectl, rollout, status, deployment/legacy, -n, lab-k28, --timeout=180s]
  - run: [kubectl, label, namespace, lab-k28, pod-security.kubernetes.io/enforce=restricted]
  - apply:
      - apiVersion: apps/v1
        kind: Deployment
        metadata: {name: legacy}
        spec:
          replicas: 2
          selector:
            matchLabels: {app: legacy}
          template:
            metadata:
              labels: {app: legacy}
            spec:
              securityContext:
                runAsNonRoot: true
                seccompProfile: {type: RuntimeDefault}
              containers:
                - name: web
                  image: nginxinc/nginx-unprivileged:1.27
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities: {drop: [ALL]}
  - run: [kubectl, rollout, status, deployment/legacy, -n, lab-k28, --timeout=180s]
