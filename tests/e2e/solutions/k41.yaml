id: k41
steps:
  - apply:
      - apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata: {name: widgets.quest.example.com}
        spec:
          group: quest.example.com
          scope: Namespaced
          names: {plural: widgets, singular: widget, kind: Widget}
          versions:
            - name: v1
              served: true
              storage: true
              schema:
                openAPIV3Schema:
                  type: object
                  properties:
                    spec:
                      type: object
                      properties:
                        size: {type: integer}
  - run: [kubectl, wait, --for=condition=Established, customresourcedefinition/widgets.quest.example.com, --timeout=60s]
  - apply:
      - apiVersion: quest.example.com/v1
        kind: Widget
        metadata: {name: first}
        spec: {size: 3}
