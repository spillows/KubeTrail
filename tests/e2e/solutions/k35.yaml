id: k35
steps:
  - run: [kubectl, uncordon, kt-multi-m02]
  - run: [kubectl, label, node, kt-multi-m02, disk=ssd, --overwrite]
  - apply:
      - apiVersion: apps/v1
        kind: Deployment
        metadata: {name: db}
        spec:
          replicas: 2
          selector:
            matchLabels: {app: db}
          template:
            metadata:
              labels: {app: db}
            spec:
              affinity:
                nodeAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    nodeSelectorTerms:
                      - matchExpressions:
                          - {key: disk, operator: In, values: [ssd]}
              containers:
                - name: db
                  image: nginx:1.27
  - run: [kubectl, rollout, status, deployment/db, -n, lab-k35, --timeout=180s]
