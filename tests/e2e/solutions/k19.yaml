id: k19
steps:
  - apply:
      - apiVersion: v1
        kind: Service
        metadata: {name: db}
        spec:
          clusterIP: None
          selector: {app: db}
          ports:
            - port: 80
      - apiVersion: apps/v1
        kind: StatefulSet
        metadata: {name: db}
        spec:
          serviceName: db
          replicas: 3
          selector:
            matchLabels: {app: db}
          template:
            metadata:
              labels: {app: db}
            spec:
              containers:
                - name: db
                  image: nginx:1.27
                  volumeMounts:
                    - {name: data, mountPath: /usr/share/nginx/html}
          volumeClaimTemplates:
            - metadata: {name: data}
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests: {storage: 100Mi}
  - run: [kubectl, rollout, status, statefulset/db, -n, lab-k19, --timeout=300s]
