id: k6
steps:
  - apply:
      - apiVersion: v1
        kind: Pod
        metadata:
          name: app
        spec:
          volumes:
            - name: shared
              emptyDir: {}
          initContainers:
            - name: write
              image: busybox:1.36
              command: [sh, -c, "echo hello > /work/index.html"]
              volumeMounts: [{name: shared, mountPath: /work}]
            - name: reader
              image: busybox:1.36
              restartPolicy: Always
              command: [sh, -c, "tail -F /work/index.html"]
              volumeMounts: [{name: shared, mountPath: /work}]
          containers:
            - name: web
              image: nginx:1.27
              volumeMounts: [{name: shared, mountPath: /usr/share/nginx/html}]
  - run: [kubectl, wait, --for=condition=Ready, pod/app, -n, lab-k6, --timeout=180s]
