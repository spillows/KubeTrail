id: k5
steps:
  - run: [kubectl, create, job, pi, --image=perl:5.34, -n, lab-k5, --, perl, -Mbignum=bpi, -wle, "print bpi(200)"]
  - run: [kubectl, wait, --for=condition=complete, job/pi, -n, lab-k5, --timeout=300s]
  - run: [kubectl, create, cronjob, tick, --image=busybox:1.36, "--schedule=*/5 * * * *", -n, lab-k5, --, date]
