id: k8
steps:
  - run: [kubectl, create, configmap, app-config, --from-literal=GREETING=hello, -n, lab-k8]
  - apply:
      - apiVersion: apps/v1
        kind: Deployment
        metadata: {name: web}
        spec:
          replicas: 1
          selector:
            matchLabels: {app: web}
          template:
            metadata:
              labels: {app: web}
            spec:
              volumes:
                - name: config
                  configMap: {name: app-config}
              containers:
                - name: web
                  image: nginx:1.27
                  envFrom:
                    - configMapRef: {name: app-config}
                  volumeMounts:
                    - {name: config, mountPath: /etc/app}
  - run: [kubectl, rollout, status, deployment/web, -n, lab-k8, --timeout=180s]
