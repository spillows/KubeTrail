id: k36
steps:
  - run: [kubectl, uncordon, mq-multi-m02]
  - run: [kubectl, taint, nodes, mq-multi-m03, "dedicated=gpu:NoSchedule", --overwrite]
  - run: [kubectl, taint, nodes, mq-multi-m03, "dedicated:NoSchedule-"]
  - apply:
      - apiVersion: apps/v1
        kind: Deployment
        metadata: {name: web}
        spec:
          replicas: 3
          selector:
            matchLabels: {app: web}
          template:
            metadata:
              labels: {app: web}
            spec:
              affinity:
                podAntiAffinity:
                  requiredDuringSchedulingIgnoredDuringExecution:
                    - topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchLabels: {app: web}
              containers:
                - name: web
                  image: nginx:1.27
  - run: [kubectl, rollout, status, deployment/web, -n, lab-k36, --timeout=180s]
