[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kubetrail"
version = "0.1.0"
description = "A hands-on Kubernetes learning app that sets up and verifies labs on your local minikube."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2"]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs against a real minikube cluster"]
addopts = "-m 'not e2e'"
